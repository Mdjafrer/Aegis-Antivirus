[package]
name = "aegis-engine"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
md5 = "0.7.0"
sled = "0.34.7"
lazy_static = "1.4.0"
reqwest = { version = "0.11", features = ["blocking", "json"] }
serde_json = "1.0"
yara-x = "0.6.0"
memmap2 = "0.9.4"
windows = { version = "0.52", features = [
    "Win32_Security_WinTrust",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_Foundation"
] }